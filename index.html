<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href='https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Manrope:wght@200..800&family=Press+Start+2P&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-player/1.4.3/lottie-player.js"></script>    

</head>

<body>

    <div class="first">
        <div style="height: 1px;">
            <div class="lightsContainer">
                <img class="lights light-left" style="margin-right: -560px; pointer-events: auto;" data-js="lightOn" src="images/LightOn.png">
                <img class="lights light-right"  data-js="lightOn" src="images/LightOn.png">
            </div>
        </div>
        <div class="twoEl">
            <lottie-player class="windows window-left" src="test.json" background="transparent" speed="1" loop autoplay></lottie-player>
            <div class="doors">
                <img style="background-size: cover;" src="images/doorFront.svg">
            </div>
            <img class="windows window-right" src="images/window.svg">
        </div>

    </div>

    <div class="second" data-js="second-screen">
        <h1 class="textt"> на квесты запрещено проносить любые личные вещи</h1>
        <div class="hands-and-table">
        <div
          class="windows-container"
          data-js="second-screen-windows-container"
        ></div>
        <div id="hands" data-js="hands">
            <img class="phone" src="images/phone.svg">
          <div class="vignette"></div>
          <img src="images/hands.svg" alt="hands" />
        </div>
        <div id="table">
          <div class="table-container">
            <picture>
              <source media="(max-width: 1024px)" srcset="images/TableBottom2.png" />
              <img src="images/TableBottom.png" alt="" />
            </picture>
            <img class="table-top" src="images/TableTop.png" alt="" />
          </div>
        </div>
      </div>
      <img id="ribbon" data-js="ribbon" src="images/ribbon.svg" alt="" />
        
    </div>
    <div class="third">
        <img class="third-dark" src="images/dark.svg">
        <p class="textt">по мере прохождения необходимо преодолевать препятствия</p>
        <div class="stairs-scene">
            <img class="stairs-ribbon stairs-ribbon-top" data-js="stairs-ribbon" src="images/ribbon.svg" alt="" />
            <img class="stairs-ribbon stairs-ribbon-middle" data-js="stairs-ribbon" src="images/ribbon.svg" alt="" />
            <img class="stairs-ribbon stairs-ribbon-bottom" data-js="stairs-ribbon" src="images/ribbon.svg" alt="" />
            <img class="stairs" src="images/stairs.png">
        </div>

    </div>
    <div class="fourth" data-js="fourth-screen">
       
        <div class="fourth-content">
            <p class="fourth-text">по статистике 20% людей боится темноты</p>
            <img class="switch" data-js="fourth-switch" src="images/off.svg" alt="switch on">
            <p class="fourth-text fourth-extra">И 3% БОИТСЯ ОГНЯ</p>
        </div>
        <img class="fire" data-js="fourth-fire" src="images/fire1.svg" alt="">

    </div>
    <div class="fifth">
        <h1>в среднем 40% людей удается пройти квест
сегодня вы оказались в их числе</h1>
    <div class="nature">
        <img class="window2 window2-left" src="images/window2.svg">
        <img class="door" src="images/door2.svg">
        <img class="window2 window2-right" src="images/window2.svg">
    </div>
    </div>

    <div class="sixth">
        <img class="darken" src="images/dark6.svg">
        <div class="star-stack">
            <img class="star-layer star-layer-1" data-js="star-layer" src="images/star.svg" alt="">
            <img class="star-layer star-layer-2" data-js="star-layer" src="images/star.svg" alt="">
            <img class="star-layer star-layer-3" data-js="star-layer" src="images/star.svg" alt="">
            <img class="star-layer star-layer-4" data-js="star-layer" src="images/star.svg" alt="">
            <img class="star-layer star-layer-5" data-js="star-layer" src="images/star.svg" alt="">
            <img class="star-layer star-layer-6" data-js="star-layer" src="images/star.svg" alt="">
        </div>
        <img class="darken2" src="images/dark6.svg">
    </div>
    <div class="seventh">
        <div class="seventh-inner">
            <div class="seventh-row">
                <img class="seventh-window" src="images/window.svg" alt="">
                <img class="seventh-window" src="images/window.svg" alt="">
            </div>
            <p class="seventh-text">ИЛИ НЕТ</p>
            <div class="seventh-row ">
                <div class="seventh-lamp-wrap">
                    <img class="seventh-lamp" src="images/LightOn.png" alt="">
                    <img class="seventh-lamp" src="images/LightOn.png" alt="">
                </div>
                
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
